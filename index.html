<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baran Loading Screen</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-switch">
        <div class="switch-button" id="bgSwitchBtn">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                <circle cx="8.5" cy="8.5" r="1.5"></circle>
                <polyline points="21 15 16 10 5 21"></polyline>
            </svg>
            <span>Background</span>
        </div>
    </div>

    <div class="background">
        <iframe class="background-iframe" src="" frameborder="0" allowfullscreen></iframe>
    </div>

    <div class="background-images">
        <div class="bg-image"></div>
        <div class="bg-image"></div>
        <div class="bg-image"></div>
        <div class="bg-image"></div>
        <div class="bg-image"></div>
    </div>

    <div class="overlay"></div>
    
    <div class="header">
        <div class="server-logo">
            <img src="img/logo.png" alt="Baran Logo">
        </div>
        <div class="server-name">
            <h1>Baran</h1>
            <h2>Loading Screen</h2>
        </div>
    </div>
    
    <div class="social-links">
    </div>
    
    <div class="right-panel">
        <div class="announcements">
            <div class="announcement-header">
                <h3>ANNOUNCEMENTS</h3>
            </div>
            <div class="announcement-content">
                <div class="announcement-title"> </div>
                <div class="announcement-text"> </div>
            </div>
        </div>
        

        <div class="team-section">
            <div class="team-header">
                <h3>TEAM</h3>
            </div>
            <div class="team-members">
             
            </div>
        </div>
    </div>
    
    <div class="music-player">
        <div class="music-header">
            <h3>MUSIC PLAYER</h3>
        </div>
        <div class="music-content">
            <div class="music-album"></div>
            <div class="music-info">
                <div class="music-title"></div>
                <div class="music-artist"></div>
            </div>
        </div>
        <div class="music-controls">
            <div class="progress-bar">
                <div class="progress"></div>
            </div>
            <div class="time-stamps">
                <span>0:00</span>
                <span>0:00</span>
            </div>
            <div class="control-buttons">
                <div class="control-button">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="19 20 9 12 19 4 19 20"></polygon>
                        <line x1="5" y1="19" x2="5" y2="5"></line>
                    </svg>
                </div>
                <div class="control-button play-pause">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="6" y="4" width="4" height="16"></rect>
                        <rect x="14" y="4" width="4" height="16"></rect>
                    </svg>
                </div>
                <div class="control-button">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="5 4 15 12 5 20 5 4"></polygon>
                        <line x1="19" y1="5" x2="19" y2="19"></line>
                    </svg>
                </div>
            </div>
            <div class="volume-control">
                <div class="volume-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                        <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
                    </svg>
                </div>
                <div class="volume-slider">
                    <div class="volume-level"></div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="server-gallery">
        <div class="gallery-header">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                <circle cx="8.5" cy="8.5" r="1.5"></circle>
                <polyline points="21 15 16 10 5 21"></polyline>
            </svg>
            <h3>SERVER GALLERY</h3>
        </div>
        <div class="gallery-images">
            <div class="gallery-image"></div>
            <div class="gallery-image"></div>
            <div class="gallery-image"></div>
        </div>
    </div>
    
    <div class="server-rules">
        <div class="rules-header">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            <h3>SERVER RULES</h3>
        </div>
        <div class="rules-list">
        </div>
    </div>
    
    <div class="loading-bar">
        <div class="loading-progress"></div>
    </div>
    <div class="loading-text">Yükleniyor...</div>
    
    <script src="script.js"></script>
</script>

</body>
</html>
